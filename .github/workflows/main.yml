name: Docker React CI
on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t ingjulianvega/docker-react -f Dockerfile.dev .

      - name: Run Tests
        run: docker run -e CI=true ingjulianvega/docker-react npm run test